server {
    listen 80;
    listen [::]:80;
    server_name tptwof.top www.tptwof.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tptwof.top www.tptwof.top;

    root /var/www/tptwo;
    index index.html;

    access_log /var/log/nginx/tptwo.access.log;
    error_log  /var/log/nginx/tptwo.error.log;

    ssl_certificate     /etc/letsencrypt/live/tptwof.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tptwof.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 登录接口：单独限流，每分钟 5 次，允许突发 3 次
    location = /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 API：宽松限流，挡住爬虫和扫描
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退：其余路径交给 index.html，由 React Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}